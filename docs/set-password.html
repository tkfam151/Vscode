<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password · ClassCode</title>
<link rel="stylesheet" href="style.css">
<script>
  // Supabase puts the result of the email link in the address (#access_token=... or #error=...).
  // Keep a copy before the Supabase library tidies the address bar.
  window.ccLinkHash = location.hash;
</script>
</head>
<body>
<div class="center">
  <form id="form" class="card auth" hidden>
    <div class="brand-title"></div>
    <h1>Set your password</h1>
    <p class="muted" id="welcome"></p>
    <label>New password <input id="pw" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>Type it again <input id="pw2" type="password" required minlength="8" autocomplete="new-password"></label>
    <p id="err" class="error" role="alert" hidden></p>
    <button class="btn primary wide" type="submit">Save password</button>
  </form>
  <div id="msg" class="card auth" hidden>
    <h1 id="msgTitle"></h1>
    <p class="muted" id="msgText"></p>
    <a class="btn primary wide" href="./">Go to ClassCode</a>
  </div>
  <p id="loading" class="muted">Checking your link…</p>
</div>
<script src="vendor/supabase/supabase.js"></script>
<script type="module" src="js/set-password.js"></script>
</body>
</html>
